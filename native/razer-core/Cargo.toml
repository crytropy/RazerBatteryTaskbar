[package]
name = "razer-core"
version = "0.1.0"
edition = "2024"
license = "ISC"
description = "UI-independent Razer protocol core for RazerBatteryTaskbar"

[features]
default = []
windows-hid = ["dep:hidapi"]

[dependencies]
directories = "6.0.0"
hidapi = { version = "2.6.7", optional = true, default-features = false, features = ["windows-native"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
