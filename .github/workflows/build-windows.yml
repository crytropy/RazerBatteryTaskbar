name: Build Windows

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'native/**'
      - 'integrations/**'
      - '.github/workflows/rust-core.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build Windows installer
        run: npm run make

      - name: Prepare release asset
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "out/make/squirrel.windows" -Recurse -Filter "*.exe" |
            Where-Object { $_.Name -like "*Setup*.exe" } |
            Select-Object -First 1

          if (-not $installer) {
            throw "Windows installer was not found."
          }

          Copy-Item $installer.FullName "RazerBatteryTaskbar-Windows-Setup.exe" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RazerBatteryTaskbar-Windows
          path: RazerBatteryTaskbar-Windows-Setup.exe
          if-no-files-found: error

      # This workflow owns RazerBatteryTaskbar-Windows-Setup.exe. rust-core.yml
      # owns the native files. Whichever workflow reaches a release first
      # creates it; the other one only uploads its own files (see
      # scripts/Publish-ReleaseAssets.ps1).
      - name: Publish latest development build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f dev-build "$env:GITHUB_SHA"
          git push origin refs/tags/dev-build --force

          $params = @{
            Tag        = 'dev-build'
            Files      = @('RazerBatteryTaskbar-Windows-Setup.exe')
            Title      = 'Development Build'
            Notes      = 'Latest automatic builds from the main branch. These builds are intended for testing and may change frequently.'
            Prerelease = $true
            NoteMarker = '<!-- electron-legacy-note -->'
            AppendNote = '**Legacy / compatibility build:** `RazerBatteryTaskbar-Windows-Setup.exe` is the Electron build, kept for hardware the native tray does not support yet. The native tray is `RazerBatteryTaskbar-Native-dev.exe` (updated when native code changes).'
          }
          ./scripts/Publish-ReleaseAssets.ps1 @params

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $params = @{
            Tag           = $env:GITHUB_REF_NAME
            Files         = @('RazerBatteryTaskbar-Windows-Setup.exe')
            Title         = "RazerBatteryTaskbar $env:GITHUB_REF_NAME"
            GenerateNotes = $true
            NoteMarker    = '<!-- electron-legacy-note -->'
            AppendNote    = '**Legacy / compatibility build:** `RazerBatteryTaskbar-Windows-Setup.exe` is the Electron installer, kept for hardware the native tray does not support yet. New installs should use `RazerBatteryTaskbar-Native-<version>.exe`; verify it with `SHA256SUMS.txt`.'
          }
          if ($env:GITHUB_REF_NAME.Contains('-')) { $params.Prerelease = $true }
          ./scripts/Publish-ReleaseAssets.ps1 @params
