name: Build Windows

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'native/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build Windows installer
        run: npm run make

      - name: Prepare release asset
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "out/make/squirrel.windows" -Recurse -Filter "*.exe" |
            Where-Object { $_.Name -like "*Setup*.exe" } |
            Select-Object -First 1

          if (-not $installer) {
            throw "Windows installer was not found."
          }

          Copy-Item $installer.FullName "RazerBatteryTaskbar-Windows-Setup.exe" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RazerBatteryTaskbar-Windows
          path: RazerBatteryTaskbar-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish latest development build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f dev-build "$env:GITHUB_SHA"
          git push origin refs/tags/dev-build --force

          gh release view dev-build --repo "$env:GITHUB_REPOSITORY" *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload dev-build "RazerBatteryTaskbar-Windows-Setup.exe" --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create dev-build "RazerBatteryTaskbar-Windows-Setup.exe" --repo "$env:GITHUB_REPOSITORY" --title "Development Build" --notes "Latest automatic Windows build from the main branch. This build is intended for testing and may change frequently." --prerelease
          }

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "RazerBatteryTaskbar-Windows-Setup.exe" --repo "$env:GITHUB_REPOSITORY" --title "RazerBatteryTaskbar $env:GITHUB_REF_NAME" --generate-notes
