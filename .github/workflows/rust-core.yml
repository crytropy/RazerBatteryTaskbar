name: Rust Native

on:
  push:
    branches:
      - main
    # Path filters are not evaluated for tag pushes, so every v* tag builds
    # and publishes a release regardless of what changed.
    tags:
      - 'v*'
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'native/**'
      - 'src/devices/razer-products.json'
      - 'scripts/Publish-ReleaseAssets.ps1'
      - '.github/workflows/rust-core.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'native/**'
      - 'src/devices/razer-products.json'
      - '.github/workflows/rust-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-native-${{ github.ref }}
  # Never cancel a tag run half way through publishing a release.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test-and-build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.native.outputs.version }}
      prerelease: ${{ steps.native.outputs.prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select stable Rust
        shell: pwsh
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust workspace (including HID probe)
        run: cargo test --workspace --all-features --all-targets

      - name: Build native tray
        run: cargo build -p razer-tray --release

      - name: Prepare native release files
        id: native
        shell: pwsh
        run: |
          # v1.0.0-rc.1 -> 1.0.0-rc.1. Every non-tag build uses the fixed
          # version "dev" so the dev-build asset name stays stable.
          $isTag = $env:GITHUB_REF -like 'refs/tags/v*'
          if ($isTag) {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = 'dev'
          }
          # A SemVer pre-release (anything after a "-") is published with
          # --prerelease and never becomes the "latest" release.
          $prerelease = if ($version.Contains('-')) { 'true' } else { 'false' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

          if ($isTag) {
            $cargoVersion = (Select-String -Path "native/razer-tray/Cargo.toml" -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
            if ($cargoVersion -ne $version.Split('-')[0]) {
              Write-Host "::warning::Tag $env:GITHUB_REF_NAME does not match the razer-tray Cargo version $cargoVersion (the app reports the Cargo version)."
            }
          }

          New-Item -ItemType Directory -Path "dist/native" -Force | Out-Null

          $name = "RazerBatteryTaskbar-Native-$version.exe"
          $exe = "dist/native/$name"
          Copy-Item "target/release/razer-tray.exe" $exe -Force

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "dist/native/SHA256SUMS.txt" -Encoding ascii

          @"
          RazerBatteryTaskbar Native $version

          Commit: $env:GITHUB_SHA

          Rust/native Windows tray frontend: tray icon and menu, settings,
          low/critical battery notifications, start with Windows,
          single-instance protection, and a read-only local integration API.

          Default startup uses the native Windows HID transport (windows-hid)
          and reads real battery values with no command-line flag:
            .\$name

          The transport currently targets only the DeathAdder V3 Pro, over its
          receiver 1532:00B7 or its USB cable 1532:00B6 (one device), MI_00,
          usage 0001:0002. It sends one battery query
          every 10 seconds, reopens/releases its HID handle
          per read, and may fail when Windows or Synapse owns the interface.
          Synapse coexistence is not verified; close Synapse and Razer
          services for the first run. Without a receiver the tray starts
          normally and shows "No supported Razer devices detected".
          For other hardware use the legacy Electron compatibility build
          (RazerBatteryTaskbar-Windows-Setup.exe, when attached to the release).

          Debug options:
            --placeholder-transport   run without any battery transport
            --experimental-hid-00b7   retired; accepted as a no-op

          Start with Windows registers only the EXE path. Entries written by
          earlier previews with the old flag still work and are rewritten
          the next time the toggle is enabled.
          Keep this EXE in a permanent location before enabling startup.

          Verify the download against SHA256SUMS.txt:
            (Get-FileHash .\$name -Algorithm SHA256).Hash

          Integration endpoint:
          http://127.0.0.1:27212/v1/status
          "@ | Set-Content "dist/native/README-NATIVE.txt" -Encoding utf8

      - name: Upload native build
        uses: actions/upload-artifact@v4
        with:
          name: RazerBatteryTaskbar-Native
          path: dist/native/*
          if-no-files-found: error

      - name: Build HID enumeration probe
        run: cargo build -p razer-core --example hid-probe --features windows-hid --release

      - name: Prepare HID probe artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/hid-probe" -Force | Out-Null

          $exe = "dist/hid-probe/RazerBatteryTaskbar-HID-Probe.exe"
          Copy-Item "target/release/examples/hid-probe.exe" $exe -Force
          Copy-Item "scripts/Run-HID-Probe.cmd" "dist/hid-probe/Run-HID-Probe.cmd" -Force

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RazerBatteryTaskbar-HID-Probe.exe" |
            Set-Content "dist/hid-probe/SHA256SUMS.txt" -Encoding ascii

          @"
          RazerBatteryTaskbar HID Probe

          Commit: $env:GITHUB_SHA

          Read-only diagnostic utility used to enumerate Razer HID collections
          before enabling the real native battery transport.

          It does not open HID device handles, modify device state,
          or send any Razer feature reports.

          Recommended: double-click Run-HID-Probe.cmd after extracting the ZIP.
          The launcher keeps the window open and saves razer-hid-report.json
          and razer-hid-errors.txt (remove the spaces in the filenames).

          Or run from PowerShell:
            .\RazerBatteryTaskbar-HID-Probe.exe
            .\RazerBatteryTaskbar-HID-Probe.exe --json
            .\RazerBatteryTaskbar-HID-Probe.exe --pid 0x00AB
            .\RazerBatteryTaskbar-HID-Probe.exe --known-only

          To save a JSON report:
            .\RazerBatteryTaskbar-HID-Probe.exe --json | Out-File -Encoding utf8 probe.json

          Reports omit serial numbers, device paths, and internal IDs.
          The recognized-product flag only means the VID/PID exists in
          our shared device database, not that battery reads work.
          "@ | Set-Content "dist/hid-probe/README-HID-PROBE.txt" -Encoding utf8

      - name: Upload HID enumeration probe
        uses: actions/upload-artifact@v4
        with:
          name: RazerBatteryTaskbar-HID-Probe
          path: dist/hid-probe/*
          if-no-files-found: error

      - name: Build one-shot battery test (separate executable)
        run: cargo build -p razer-core --example battery-once --features windows-hid --release

      - name: Prepare one-shot battery test artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/battery-once" -Force | Out-Null

          $exe = "dist/battery-once/RazerBatteryTaskbar-Battery-Once-Test.exe"
          Copy-Item "target/release/examples/battery-once.exe" $exe -Force

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RazerBatteryTaskbar-Battery-Once-Test.exe" |
            Set-Content "dist/battery-once/SHA256SUMS.txt" -Encoding ascii

          @"
          RazerBatteryTaskbar Battery Once Test

          Commit: $env:GITHUB_SHA
          EXPERIMENTAL HARDWARE DIAGNOSTIC — NOT A NORMAL APP BUILD.

          Scope: Razer DeathAdder V3 Pro stock receiver (VID 1532, PID 00B7),
          HID MI_00, usage page 0001 / usage 0002 only.

          This tool opens one HID handle and sends exactly one battery query
          using SetFeature/GetFeature. It DOES NOT modify mouse settings or
          change Windows drivers. It may fail when Synapse owns the interface.
          Close Synapse and all Razer background services for the initial test.

          It runs no HID operation without the explicit command-line flag.

          In PowerShell:
            .\RazerBatteryTaskbar-Battery-Once-Test.exe --help
            .\RazerBatteryTaskbar-Battery-Once-Test.exe --read-battery-once

          The native tray already uses the same HID transport by default;
          this tool remains a standalone one-shot diagnostic.
          "@ | Set-Content "dist/battery-once/README-BATTERY-TEST.txt" -Encoding utf8

      - name: Upload one-shot battery test
        uses: actions/upload-artifact@v4
        with:
          name: RazerBatteryTaskbar-Battery-Once-Test
          path: dist/battery-once/*
          if-no-files-found: error

  # Publishes the native build. Runs only for v* tags (formal release) and for
  # pushes to main (attaches to the dev-build pre-release). The job above keeps
  # a read-only token; only this job can write releases.
  publish-release:
    needs: test-and-build
    if: >-
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download native build
        uses: actions/download-artifact@v4
        with:
          name: RazerBatteryTaskbar-Native
          path: dist/native

      # This workflow owns RazerBatteryTaskbar-Native-<version>.exe,
      # SHA256SUMS.txt and README-NATIVE.txt. build-windows.yml owns
      # RazerBatteryTaskbar-Windows-Setup.exe. Whichever workflow reaches the
      # release first creates it; the other one only uploads its own files.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test-and-build.outputs.version }}
          PRERELEASE: ${{ needs.test-and-build.outputs.prerelease }}
        run: |
          $params = @{
            Tag           = $env:GITHUB_REF_NAME
            Files         = @(
              "dist/native/RazerBatteryTaskbar-Native-$env:VERSION.exe",
              "dist/native/SHA256SUMS.txt",
              "dist/native/README-NATIVE.txt"
            )
            Title         = "RazerBatteryTaskbar $env:GITHUB_REF_NAME"
            GenerateNotes = $true
          }
          if ($env:PRERELEASE -eq 'true') { $params.Prerelease = $true }
          ./scripts/Publish-ReleaseAssets.ps1 @params

      - name: Attach to development build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The dev-build tag is moved by build-windows.yml; this job only adds
          # the native files (fixed version "dev") to that pre-release.
          $params = @{
            Tag        = 'dev-build'
            Files      = @(
              "dist/native/RazerBatteryTaskbar-Native-dev.exe",
              "dist/native/SHA256SUMS.txt",
              "dist/native/README-NATIVE.txt"
            )
            Title      = 'Development Build'
            Notes      = 'Latest automatic builds from the main branch. These builds are intended for testing and may change frequently.'
            Target     = $env:GITHUB_SHA
            Prerelease = $true
          }
          ./scripts/Publish-ReleaseAssets.ps1 @params
